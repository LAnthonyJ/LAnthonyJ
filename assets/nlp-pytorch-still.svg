<svg xmlns="http://www.w3.org/2000/svg" id="static-nlp-pytorch-still" width="900" height="156" viewBox="0 0 900 156" role="img" aria-labelledby="static-nlp-pytorch-title static-nlp-pytorch-desc">
  <title id="static-nlp-pytorch-title">NLP in PyTorch</title>
  <desc id="static-nlp-pytorch-desc">Mean accuracy over four tasks on 768 held-out prompts: correct-answer training 52.73%, direct preference optimization 45.57%. The bars use a common zero-to-100% scale.</desc>
  <style>

    :root { --paper:#fff2e7; --ink:#4e3023; --sub:#795644; --accent:#ae6043; --tone:#edcfb9; --border:#e8d5c8 }
    @media (prefers-color-scheme:dark) { :root { --paper:#352922; --ink:#fff0df; --sub:#e3bda6; --accent:#f4ac83; --tone:#5b4031; --border:#5d463a } }
    text { font-family:Inter,Segoe UI,Arial,sans-serif; fill:var(--ink) }
    .kicker {font:600 18px 'Segoe UI',Arial,sans-serif;letter-spacing:1.8px;fill:var(--sub)}
    .label {font-size:20px;font-weight:600}

  </style>
  <rect x="1" y="1" width="898" height="154" rx="18" fill="var(--paper)" stroke="var(--border)" stroke-width="2"/>
  <text class="kicker" x="30" y="56">MODEL EVALUATION</text>
  <text x="28" y="109" font-size="44" letter-spacing="-1.8" font-weight="750">NLP in PyTorch</text>
  <text x="419" y="66" font-size="21">Correct answers</text><text x="419" y="108" font-size="21">DPO</text>
  <g fill="var(--tone)"><rect x="578" y="48" width="200" height="16" rx="6"/><rect x="578" y="90" width="200" height="16" rx="6"/></g>
  <g fill="var(--accent)" class="bar motion"><rect x="578" y="48" width="105.46" height="16" rx="6"/><rect x="578" y="90" width="91.14" height="16" rx="6"/></g>
  <text class="label" x="795" y="65">52.73%</text><text class="label" x="795" y="107">45.57%</text>
</svg>
