<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="nlp-attention-title nlp-attention-desc">
  <title id="nlp-attention-title">NLP in PyTorch</title>
  <desc id="nlp-attention-desc">I changed input token 4. The causal attention mask blocks later inputs, so the first three outputs stayed identical. Filled cells show visible inputs and crosses show blocked ones.</desc>
  <style>
    text { font-family:Inter, 'Segoe UI', Arial, sans-serif; fill:var(--ink) }
    .title { font-size:43px; font-weight:750; letter-spacing:-1.4px }
    .topic { font-size:17px; font-weight:650; letter-spacing:1.4px; fill:var(--sub) }
    .line { font-size:25px; font-weight:550 }
    .label { font-size:18px; font-weight:550; fill:var(--sub) }

    :root { --paper:#fff3e7; --ink:#4a3023; --sub:#70543e; --rim:#e8d2bd; --yes:#905439; --off:#f3e2d0; --mark:#805b49 }
    @media (prefers-color-scheme:dark) {
      :root { --paper:#342922; --ink:#fff2e4; --sub:#e0baa3; --rim:#58463a; --yes:#e4a379; --off:#48382e; --mark:#d0b6a7 }
    }

  </style>
  <rect x="1" y="1" width="898" height="208" rx="18" fill="var(--paper)" stroke="var(--rim)" stroke-width="2"/>
  <text class="topic" x="31" y="42">TRANSFORMER IMPLEMENTATION</text>
  <text class="title" x="29" y="96">NLP in PyTorch</text>
  <text class="line" x="31" y="143">I changed input 4. With causal masking,</text>
  <text class="line" x="31" y="175">the first three outputs stayed the same.</text>
  <path d="M555 26v158" stroke="var(--rim)" stroke-width="2"/>
  <text class="label" x="683" y="30">Input token</text>
  <g text-anchor="middle" font-size="17" font-weight="600">
    <text x="675" y="53">1</text>
    <text x="722" y="53">2</text>
    <text x="769" y="53">3</text>
    <text x="816" y="53">4</text>
  </g>
  <text x="573" y="80" font-size="17">Output 1</text>
  <rect x="656" y="61" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="703" y="61" width="38" height="25" rx="5" fill="var(--off)"/>
  <path d="M718 70l8 8m0-8-8 8" fill="none" stroke="var(--mark)" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="750" y="61" width="38" height="25" rx="5" fill="var(--off)"/>
  <path d="M765 70l8 8m0-8-8 8" fill="none" stroke="var(--mark)" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="797" y="61" width="38" height="25" rx="5" fill="var(--off)"/>
  <path d="M812 70l8 8m0-8-8 8" fill="none" stroke="var(--mark)" stroke-width="1.8" stroke-linecap="round"/>
  <text x="573" y="113" font-size="17">Output 2</text>
  <rect x="656" y="94" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="703" y="94" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="750" y="94" width="38" height="25" rx="5" fill="var(--off)"/>
  <path d="M765 103l8 8m0-8-8 8" fill="none" stroke="var(--mark)" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="797" y="94" width="38" height="25" rx="5" fill="var(--off)"/>
  <path d="M812 103l8 8m0-8-8 8" fill="none" stroke="var(--mark)" stroke-width="1.8" stroke-linecap="round"/>
  <text x="573" y="146" font-size="17">Output 3</text>
  <rect x="656" y="127" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="703" y="127" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="750" y="127" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="797" y="127" width="38" height="25" rx="5" fill="var(--off)"/>
  <path d="M812 136l8 8m0-8-8 8" fill="none" stroke="var(--mark)" stroke-width="1.8" stroke-linecap="round"/>
  <text x="573" y="179" font-size="17">Output 4</text>
  <rect x="656" y="160" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="703" y="160" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="750" y="160" width="38" height="25" rx="5" fill="var(--yes)"/>
  <rect x="797" y="160" width="38" height="25" rx="5" fill="var(--yes)"/>
</svg>
