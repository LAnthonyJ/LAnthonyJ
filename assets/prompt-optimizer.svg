<svg xmlns="http://www.w3.org/2000/svg" width="900" height="222" viewBox="0 0 900 222" role="img" aria-labelledby="prompt-optimizer-title prompt-optimizer-desc">
  <title id="prompt-optimizer-title">Prompt Optimizer</title><desc id="prompt-optimizer-desc">Example: rewrite “Summarize these notes” to request decisions, owners, and due dates. Test both prompts on the same input, compare the answers, and refine.</desc>
  <style>
    :root { --paper:#f4f1fa; --ink:#352747; --sub:#655376; --rim:#d9cfe4; --panel:#ebe3f4; --mark:#ab7cbc }
    @media (prefers-color-scheme:dark) {
      :root { --paper:#292332; --ink:#f5edf9; --sub:#d4c1dd; --rim:#504159; --panel:#403346; --mark:#bc8fc9 }
    }
    text { font-family:'Segoe UI',Arial,sans-serif;fill:var(--ink) }
    .small { font-weight:650;letter-spacing:1.5px;font-size:16px;fill:var(--sub) }
    .step { font-weight:600;font-size:16px;fill:var(--sub) }

    .pencil {stroke-dasharray:100;animation:mark 6s ease-in-out infinite}
    @keyframes mark {0%,12%{stroke-dashoffset:100} 48%,90%{stroke-dashoffset:0} 100%{stroke-dashoffset:100}}
    @media (prefers-reduced-motion:reduce){.pencil{animation:none}}
  </style>
  <rect x="1" y="1" width="898" height="220" rx="18" fill="var(--paper)" stroke="var(--rim)" stroke-width="2"/>
  <text x="31" y="48" class="small">PROMPT ENGINEERING</text>
  <text x="28" y="108" font-size="46" font-weight="750" letter-spacing="-1.7">Prompt Optimizer</text>
  <g font-size="25"><text x="31" y="155">Rewrite the instruction.</text><text x="31" y="186">Compare the answers.</text></g>
  <rect x="416" y="16" width="466" height="190" rx="14" fill="var(--panel)"/>
  <text x="438" y="48" class="step">Draft · Meeting notes</text>
  <text x="438" y="80" font-size="24">Summarize these notes.</text>
  <path d="M438 96h422" stroke="var(--rim)" stroke-width="2"/>
  <text x="438" y="124" class="step">Example rewrite</text>
  <text x="438" y="153" font-size="24">List each decision, owner, and due date.</text>
  <text x="438" y="184" font-size="24">Mark missing details as unknown.</text>
  <path class="pencil" d="M438 190q118 3 230 0" pathLength="100" fill="none" stroke="var(--mark)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
